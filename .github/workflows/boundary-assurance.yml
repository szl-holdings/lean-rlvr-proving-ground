name: Boundary assurance research contracts
on:
  pull_request:
    paths:
      - 'research/boundary_lab/**'
      - '.github/workflows/boundary-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'research/boundary_lab/**'
      - '.github/workflows/boundary-assurance.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline contracts (no models, credentials, network, or training)
        working-directory: research/boundary_lab
        run: |
          python3 -B -m unittest -v
          python3 -B assurance_demo.py --out "$RUNNER_TEMP/boundary-assurance-${{ github.run_id }}-${{ github.run_attempt }}"
