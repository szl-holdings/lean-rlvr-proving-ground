name: kernel-referee-ci
on:
  push:
  pull_request:

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      # Org policy: actions pinned to full-length commit SHAs.
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install elan + pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check seed probes (lake build)
        run: lake build
      - name: Referee self-test (fail-closed)
        run: python3 selftest.py
      - name: Test chain-gate failure propagation with synthetic receipts
        run: python3 -B -m unittest discover -s tests -p 'test_ci_contract.py' -v
      - name: Target-bound proof and review-corpus regressions
        run: python3 -B -m unittest discover -s tests -p 'test_proof_boundary.py' -v
      - name: Chain integrity check
        run: python3 -c "import chains; result = chains.verify(); print(result); raise SystemExit(0 if result.get('ok') is True else 1)"
