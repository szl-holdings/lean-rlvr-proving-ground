name: kernel-referee-ci
on:
  push:
  pull_request:

# Least privilege: both CI jobs are read-only (checkout + test suites).
permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      # Org policy: actions pinned to full-length commit SHAs.
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install elan + pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check seed probes (lake build)
        run: lake build
      - name: Sorry / axiom gate (fail-closed; kernel #print axioms per theorem)
        run: python3 .github/scripts/lean_axiom_gate.py .
      - name: Referee self-test (fail-closed)
        run: python3 selftest.py
      - name: Test chain-gate failure propagation with synthetic receipts
        run: python3 -B -m unittest discover -s tests -p 'test_ci_contract.py' -v
      - name: Target-bound proof and review-corpus regressions
        run: python3 -B -m unittest discover -s tests -p 'test_proof_boundary.py' -v
      - name: Reward batch and pinned offline migration regressions
        run: |
          python3 -B -m unittest discover -s tests -p 'test_reward_batch.py' -v
          python3 -B -m unittest discover -s tests -p 'test_sampled_difficulty.py' -v
          python3 -B -m unittest discover -s tests -p 'test_stage_review.py' -v
      - name: Lutar A1-A5 synthetic SFT curriculum integrity (no launch)
        run: |
          python3 -B curriculum/lutar_axioms.py --check
          python3 -B -m unittest discover -s tests -p 'test_lutar_curriculum.py' -v
      - name: Hard-math Putnam and open-conjecture source-pointer integrity (no model launch)
        run: |
          python3 research/hard_problems/challenge_index.py validate --catalog research/hard_problems/catalog.v1.json
          python3 -B -m unittest discover -s tests -p 'test_hard_problem_catalog.py' -v
          python3 -B -m unittest discover -s tests -p 'test_putnam25_preflight.py' -v
          python3 -B -m unittest discover -s tests -p 'test_local_model_probe.py' -v
          python3 -B -m unittest discover -s tests -p 'test_score_local_attempts.py' -v
          python3 -B -m unittest discover -s tests -p 'test_benchmark_exposure.py' -v
      - name: Five-role 54h source and original Egyptian/Greek math gates (no GPU)
        run: |
          python3 -B proving54/admission.py
          python3 -B -m unittest discover -s tests -p 'test_proving54_admission.py' -v
      - name: Controlled 54h CPU one-shot source and tamper tests (no GPU)
        run: |
          python3 -B proving54/cli.py doctor
          python3 -B -m unittest discover -s tests -p 'test_proving54_local_cpu.py' -v
      - name: Chain integrity check
        run: python3 -c "import chains; result = chains.verify(); print(result); raise SystemExit(0 if result.get('ok') is True else 1)"

  proving54-windows:
    # The 54h run happens on a Windows laptop; this runs the proving54 suites on
    # Windows so the msvcrt lock and Windows rename paths are exercised in CI.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF so pinned source digests match on Windows
        run: git config --global core.autocrlf false
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: proving54 admission, doctor and CPU suites on Windows (no GPU)
        run: |
          python --version
          python -B proving54/admission.py
          python -B proving54/cli.py doctor
          python -B -m unittest discover -s tests -p 'test_proving54_*.py' -v

  isolated-worker:
    # OS-isolated, credential-free Lean worker (bwrap): fail-closed contract,
    # sandbox properties (no env, no network, no HOME, read-only toolchain),
    # core lane and a pinned real-Mathlib lane. No model, GPU or credentials.
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install bubblewrap and allow unprivileged user namespaces on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install elan + pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the pinned read-only Mathlib workspace (network at setup only)
        run: ./worker/setup_mathlib_workspace.sh "$RUNNER_TEMP/mathlib-ws"
      - name: Isolated worker suite (sandbox required, real Mathlib lane on)
        env:
          SZL_REQUIRE_SANDBOX: "1"
        run: |
          export SZL_MATHLIB_WORKSPACE="$RUNNER_TEMP/mathlib-ws"
          python3 -B -m unittest discover -s tests -p 'test_isolated_worker.py' -v
